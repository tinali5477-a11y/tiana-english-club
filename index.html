<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiana's English Club</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#38354e;background:#fff9fa}*{box-sizing:border-box}body{margin:0;background:linear-gradient(130deg,#fff8f9,#f6f4ff)}main{max-width:920px;margin:auto;padding:30px 18px 90px}.hero{background:white;padding:28px;border-radius:28px;box-shadow:0 8px 32px #c0adcf24}.eyebrow{color:#a077a8;font-weight:700;letter-spacing:.11em;font-size:.75em}h1{font-size:clamp(27px,5vw,44px);margin:8px 0}p{line-height:1.65}.muted{color:#77718a}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pill{background:#f5e8f5;padding:7px 12px;border-radius:30px;font-size:13px}button{border:0;border-radius:16px;padding:12px 16px;font-size:15px;cursor:pointer;background:#f0eaf9;color:#403650}button.primary{background:#b473a9;color:white}button:disabled{opacity:.45;cursor:not-allowed}button:hover:not(:disabled){filter:brightness(.96)}section.panel{background:white;padding:22px;border-radius:24px;margin-top:18px;box-shadow:0 6px 24px #afa1bf1c}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}.day{padding:10px 4px;text-align:center;border-radius:14px;font-size:12px}.day.done{background:#e4f5ec;color:#286144}.day.active{background:#b473a9;color:white}.bar{height:12px;border-radius:20px;background:#f2e8f2;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#ea93a8,#a79ae8);transition:width .25s}.options{display:grid;gap:10px;margin:16px 0}.options button{text-align:left;background:#f7f2fb;border:1px solid #eee4f2}.feedback{min-height:30px;color:#995b87;font-weight:650}input[type=text]{width:100%;padding:15px;border:1px solid #e4d6e9;border-radius:14px;font:inherit}#lesson{display:none}.fig{font-size:32px;background:#fcf1f8;border-radius:18px;padding:14px;text-align:center}.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}.teacher{border-left:4px solid #dd91b5;padding:12px 16px;background:#fff8fd;border-radius:12px}small{color:#77718a}@media(max-width:650px){main{padding:16px 12px}.hero{padding:20px}section.panel{padding:17px}}
</style></head><body><main>
<header class="hero"><div class="eyebrow">TIANA'S ENGLISH CLUB · ENGLISH IN BLOOM</div><h1>每天五分钟，英语更自在 ✨</h1><p class="muted">和你的英语老师 Mia 一起练习真实生活、旅行与 EO 工作场景。先完成一节，再决定要不要挑战第二节。</p><div class="row"><span class="pill" id="stats"></span><span class="pill" id="streak"></span><span class="pill">🌸 轻松练习 · 不补罚</span></div><p><button class="primary" id="start">开始今天的5分钟挑战 →</button> <button id="voiceTest">🔊 试听英语发音</button></p><div class="row"><label>发音 <select id="voices"><option>正在寻找英语语音…</option></select></label><label>语速 <select id="speed"><option value=".75">慢速 0.75×</option><option value=".9" selected>适中 0.9×</option><option value="1">正常 1×</option></select></label><label>模式 <select id="mode"><option value="silent">安静模式：点击/输入</option><option value="speak">开口模式：尽量使用麦克风</option></select></label></div><small id="voiceMsg">语音由设备浏览器生成；请选择英语语音后试听。</small></header>
<section class="panel"><div class="row" style="justify-content:space-between"><h2>30天成长地图</h2><span id="progressText"></span></div><div class="bar"><div class="fill" id="bar" style="width:0%"></div></div><p class="muted">每天两节微课，每完成一节都算进步；完成任意一节就达成当天目标。</p><div class="grid" id="map"></div></section>
<section class="panel" id="lesson"><div class="row" style="justify-content:space-between"><span class="pill" id="lessonNum"></span><button id="close">先休息</button></div><h2 id="lessonTitle"></h2><div class="teacher" id="teacher"></div><div id="task"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="row"><button id="repeat">🔊 再听一次</button><button id="mic" hidden>🎙️ 说出答案</button><button class="primary" id="next" disabled>下一步 →</button></div></section>
<section class="panel"><h2>🎁 盲盒收藏架</h2><p class="muted">完成真实挑战后才能拆盲盒。每个小人偶都有惊喜稀有度！</p><div class="shelf" id="shelf"></div></section>
<footer class="muted" style="text-align:center;margin-top:22px;font-size:12px">学习记录仅保存在当前浏览器，请不要清除网站数据。建议优先用同一台设备。</footer></main>
<script>
const scenarios=[
['Free time','休闲时光','I enjoy traveling.','我喜欢旅行。','I enjoy traveling in my free time.','我喜欢在空闲时间旅行。','What do you enjoy in your free time?'],
['Coffee chat','日常聊天','I like reading.','我喜欢阅读。','I like reading in the evening.','我喜欢晚上阅读。','What do you like doing in the evening?'],
['Meeting people','初次见面','I work with entrepreneurs.','我和企业家一起工作。','I work with entrepreneurs from different countries.','我与来自不同国家的企业家合作。','Who do you work with?'],
['Travel plans','旅行计划','I want to visit Japan.','我想去日本。','I want to visit Japan next spring.','我想明年春天去日本。','Where do you want to travel next?'],
['EO events','EO活动','I organize events.','我组织活动。','I organize learning events for EO members.','我为EO会员组织学习活动。','What kind of events do you organize?'],
['Online meeting','线上会议','I have a question.','我有一个问题。','I have a question about member engagement.','我有一个关于会员互动的问题。','Do you have any questions?'],
['Working together','团队协作','We need a plan.','我们需要一个计划。','We need a clear plan for next month.','我们需要下个月的明确计划。','What is our plan for next month?'],
['Sharing ideas','表达观点','I agree with you.','我同意你的看法。','I agree with you on this important point.','在这个重要问题上我同意你的看法。','What do you think about this idea?'],
['Membership','会员招募','We welcome new members.','我们欢迎新会员。','We welcome new members from different industries.','我们欢迎来自不同行业的新会员。','How can we welcome new members?'],
['Confidence','自信表达','I can share my ideas.','我能分享想法。','I can share my ideas clearly in meetings.','我能在会议上清楚表达想法。','Would you like to share your thoughts?']
];
const key='tiana-english-club-v2',state=JSON.parse(localStorage.getItem(key)||'{"done":[],"boxes":[],"xp":0,"dates":[]}');let unit=0,step=0,answer='',currentSpeak='',choice='',recognition=null;
const $=s=>document.querySelector(s),save=()=>localStorage.setItem(key,JSON.stringify(state)),s=(n)=>scenarios[Math.floor(n/2)%scenarios.length],esc=t=>String(t).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;'),norm=t=>String(t).toLowerCase().replace(/[^a-z ]/g,'').replace(/\\s+/g,' ').trim();
function render(){let completed=state.done.length;$('#stats').textContent='⭐ '+state.xp+' XP · '+completed+'/60 节';$('#progressText').textContent=completed+' / 60';$('#bar').style.width=(completed/60*100)+'%';let today=new Date().toLocaleDateString('en-CA');let streak=0;for(let i=0;i<60;i++){let d=new Date();d.setDate(d.getDate()-i);if(state.dates.includes(d.toLocaleDateString('en-CA')))streak++;else if(i===0)continue;else break}$('#streak').textContent='🔥 '+streak+' 天持续学习';$('#map').innerHTML=Array.from({length:30},(_,i)=>'<button class="day '+(state.done.includes(i*2)&&state.done.includes(i*2+1)?'done':'')+'" data-day="'+i+'">Day '+(i+1)+'<div>'+(state.done.includes(i*2)?'●':'○')+' '+(state.done.includes(i*2+1)?'●':'○')+'</div></button>').join('');document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{let d=+b.dataset.day;openUnit(d*2+(state.done.includes(d*2)?1:0))});$('#shelf').innerHTML=state.boxes.length?state.boxes.map(x=>'<div class="fig">'+x.icon+'<div style="font-size:11px">'+x.name+'</div><small>'+x.rarity+'</small></div>').join(''):'<p class="muted">完成第一节课，解锁你的第一只小人偶吧！</p>'}
function nextUnit(){let i=Array.from({length:60},(_,j)=>j).find(j=>!state.done.includes(j));return i===undefined?0:i}
function getVoices(){let a=speechSynthesis.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang));a.sort((x,y)=>Number(/premium|enhanced|natural|samantha|google|microsoft/i.test(y.name))-Number(/premium|enhanced|natural|samantha|google|microsoft/i.test(x.name)));let old=$('#voices').value;$('#voices').innerHTML=a.map((v,i)=>'<option value="'+i+'">'+esc(v.name)+' ('+esc(v.lang)+')</option>').join('');window.engVoices=a;if(a.some(v=>v.name===old))$('#voices').value=String(a.findIndex(v=>v.name===old));$('#voiceMsg').textContent=a.length?'已找到 '+a.length+' 个英语发音人。听感不自然时，可换一个声音试听。':'未找到英语发音人，请检查系统语音包。'}
function speak(t){currentSpeak=t;if(!('speechSynthesis'in window)){$('#voiceMsg').textContent='当前浏览器不支持语音朗读';return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=Number($('#speed').value);let v=window.engVoices?.[Number($('#voices').value)];if(v){u.voice=v;u.lang=v.lang}speechSynthesis.speak(u)}
function openUnit(i){unit=i%60;step=0;$('#lesson').style.display='block';$('#lessonNum').textContent='Day '+(Math.floor(unit/2)+1)+' · 第'+(unit%2+1)+'节 · 5分钟微课';$('#lessonTitle').textContent=s(unit)[0]+' · '+s(unit)[1];$('#lesson').scrollIntoView({behavior:'smooth'});task()}
function choices(arr,good){let opts=[...arr];opts.sort(()=>Math.random()-.5);$('#task').innerHTML='<div class="options">'+opts.map(o=>'<button data-answer="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div>';document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{let yes=b.dataset.answer===good;if(yes){$('#feedback').innerHTML='✅ 正确！<strong>'+esc(good)+'</strong>';$('#next').disabled=false;document.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true)}else{$('#feedback').innerHTML='💡 这不是正确答案。正确表达的含义是：<strong>'+esc(good)+'</strong><p style="font-weight:400;margin:6px 0">请选择上面对应的选项，就可以继续。答错没关系。</p>';b.style.opacity='.5'}})}
function task(){mistakes=0;const z=s(unit);$('#feedback').textContent='';$('#next').disabled=true;$('#mic').hidden=true;$('#next').textContent=step===5?'完成挑战 🎁':'下一步 →';const teacher=$('#teacher');teacher.innerHTML='<strong>Mia：</strong> '+['先听一个英语表达，再选择正确中文含义。','看看这句话的英语意思。','把短句扩展成更完整的表达。','轮到你了！根据中文提示自己输入英语。','听听真实情境中的问题，并选出合适回答。','最后一题：不看提示，输入今天学会的完整句子。'][step];let a=z[2],b=z[4];if(step===0){speak(a);choices([z[3],'我现在很忙。','我不喜欢说英语。'],z[3]);}else if(step===1){speak(b);choices([z[5],'我昨天没参加活动。','我想早点睡觉。'],z[5]);}else if(step===2){$('#task').innerHTML='<p>短句：<strong>'+esc(a)+'</strong></p><p>升级后是哪一句？</p>';let h=$('#task').innerHTML;choices([b,a,a.replace('.',' today.')],b);$('#task').insertAdjacentHTML('afterbegin',h);}else if(step===3){$('#task').innerHTML='<p><strong>'+esc(z[5])+'</strong></p><input id="typed" type="text" autocomplete="off" placeholder="在这里输入英文句子"><p><button id="check">检查答案</button></p>';$('#check').onclick=checkTyped;$('#reveal').onclick=()=>{$('#feedback').innerHTML='📘 参考句：<strong>'+esc(z[4])+'</strong><br><small>可以照着句子练习，再提交答案。</small>';speak(z[4])};$('#typed').onkeydown=e=>{if(e.key==='Enter')checkTyped()};}else if(step===4){speak(z[6]);$('#task').innerHTML='<p><strong>'+esc(z[6])+'</strong></p>';let h=$('#task').innerHTML;choices([b,'I am not sure.','See you tomorrow.'],b);$('#task').insertAdjacentHTML('afterbegin',h);}else{$('#task').innerHTML='<p>请凭记忆写出：<strong>'+esc(z[5])+'</strong></p><input id="typed" type="text" autocomplete="off" placeholder="不看前面的英文，再写一次"><p><button id="check">提交闯关答案</button></p>';$('#check').onclick=checkTyped;$('#reveal').onclick=()=>{$('#feedback').innerHTML='📘 参考句：<strong>'+esc(z[4])+'</strong><br><small>可以照着句子练习，再提交答案。</small>';speak(z[4])};$('#typed').onkeydown=e=>{if(e.key==='Enter')checkTyped()};}if($('#mode').value==='speak'&&(step===3||step===5)&&('SpeechRecognition'in window||'webkitSpeechRecognition'in window))$('#mic').hidden=false;}
let mistakes=0;
function wordDifference(given,expected){const a=given.trim().split(/\s+/),b=expected.trim().split(/\s+/);let parts=[];for(let i=0;i<Math.max(a.length,b.length);i++){let actual=a[i]||'（缺少）',wanted=b[i]||'（多余）';if(norm(actual)!==norm(wanted))parts.push('第 '+(i+1)+' 个词：你写的是「'+esc(actual)+'」，参考是「'+esc(wanted)+'」');}return parts.slice(0,5).join('<br>')}
function checkTyped(){let target=s(unit)[4],v=$('#typed').value.trim();if(!v){$('#feedback').textContent='请先输入一句英语；不会写可以点下方「查看示范」。';return}if(norm(v)===norm(target)){$('#feedback').innerHTML='✅ 很好！表达正确。<br><small>大小写、标点和多余空格都不会被扣分。</small>';$('#next').disabled=false;$('#typed').disabled=true;$('#check').disabled=true;return;}mistakes++;let diff=wordDifference(v,target);$('#feedback').innerHTML='💡 我找到可能的不同之处：<br>'+diff+'<p style="margin:8px 0 4px">参考句：<strong>'+esc(target)+'</strong></p><small>请照着提示修改，再点「检查答案」。</small>';if(mistakes>=2){$('#feedback').insertAdjacentHTML('beforeend','<p><button id="useExample" type="button">使用示范句，再读一遍 →</button></p>');$('#useExample').onclick=()=>{$('#typed').value=target;speak(target);$('#feedback').innerHTML='🔊 正在朗读示范句。看清楚每个词，再点「检查答案」继续。';$('#typed').focus();};}}
function finish(){if(!state.done.includes(unit)){state.done.push(unit);state.xp+=25;let today=new Date().toLocaleDateString('en-CA');if(!state.dates.includes(today))state.dates.push(today);let r=Math.random(),icons=[['🐻','软萌小熊','普通'],['🐰','月光兔兔','普通'],['🦊','蜜桃小狐','稀有'],['🦄','星光独角兽','隐藏款']];let x=r<.06?icons[3]:r<.28?icons[2]:icons[Math.floor(Math.random()*2)];state.boxes.push({icon:x[0],name:x[1],rarity:x[2]});save();alert('🎁 盲盒开启！\n你获得：'+x[1]+'（'+x[2]+'）\n今天的努力值得庆祝！')}$('#lesson').style.display='none';render();window.scrollTo({top:0,behavior:'smooth'})}
$('#next').onclick=()=>{if(step>=5)finish();else{step++;task()}};$('#start').onclick=()=>openUnit(nextUnit());$('#close').onclick=()=>$('#lesson').style.display='none';$('#repeat').onclick=()=>speak(currentSpeak||s(unit)[2]);$('#voiceTest').onclick=()=>speak('I enjoy traveling in my free time.');$('#mic').onclick=()=>{let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return;let r=new R();r.lang='en-US';r.onresult=e=>{$('#typed').value=e.results[0][0].transcript;checkTyped()};r.onerror=()=>$('#feedback').textContent='麦克风暂时无法识别，可直接输入答案。';r.start()};if('speechSynthesis'in window){getVoices();speechSynthesis.onvoiceschanged=getVoices;}render();
</script></body></html>
