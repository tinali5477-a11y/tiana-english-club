<header class="hero"><div class="eyebrow">TIANA / ENGLISH STUDIO · 30-DAY JOURNEY</div><h1>把英语，慢慢说成自己的语言。</h1><p class="muted">有方法地学一点，有信心地说一句。从日常、旅行到 EO 英文会议，和 Mia 每天完成一次真正的小进步。</p><div class="row"><span class="pill" id="stats"></span><span class="pill" id="streak"></span><span class="pill">DAY BY DAY · AT YOUR OWN PACE</span></div><div class="progress-note" id="dayStatus">正在同步学习进度…</div><p><button class="primary" id="start">开始今天的5分钟挑战 →</button> <button id="voiceTest">🔊 试听英语发音</button></p><div class="row"><label>发音 <select id="voices"><option>正在寻找英语语音…</option></select></label><label>语速 <select id="speed"><option value=".75">慢速 0.75×</option><option value=".9" selected>适中 0.9×</option><option value="1">正常 1×</option></select></label><label>模式 <select id="mode"><option value="silent">安静模式：点击/输入</option><option value="speak">开口模式：尽量使用麦克风</option></select></label></div><small id="voiceMsg">语音由设备浏览器生成；请选择英语语音后试听。</small></header>

const scenarios=[["Free time · Basics","休闲时光 · 基础","I enjoy traveling.","我喜欢旅行。","I enjoy traveling in my free time.","我喜欢在空闲时间旅行。","What do you enjoy in your free time?"],["Free time · Practice","休闲时光 · 应用","I like exploring new places.","我喜欢探索新的地方。","I like exploring new places when I travel.","旅行时我喜欢探索新的地方。","What do you like doing when you travel?"],["Daily routine · Basics","日常习惯 · 基础","I get up early.","我起得很早。","I usually get up early on weekdays.","工作日我通常起得很早。","What time do you usually get up?"],["Daily routine · Practice","日常习惯 · 应用","I take a short walk.","我会散一小会儿步。","I take a short walk after dinner.","晚饭后我会散一小会儿步。","What do you do after dinner?"],["Hobbies · Basics","兴趣爱好 · 基础","I like reading.","我喜欢阅读。","I like reading books about personal growth.","我喜欢阅读关于个人成长的书。","What kinds of books do you like?"],["Hobbies · Practice","兴趣爱好 · 应用","I practice yoga.","我练瑜伽。","I practice yoga to relax after work.","我练瑜伽来放松工作后的身心。","How do you relax after work?"],["Food · Basics","美食 · 基础","I love Chinese food.","我喜欢中餐。","I love Chinese food, especially hot pot.","我喜欢中餐，尤其是火锅。","What food do you love?"],["Food · Practice","美食 · 应用","I want to try this dish.","我想尝尝这道菜。","I want to try this dish because it looks delicious.","我想尝尝这道菜，因为它看起来很好吃。","Would you like to try this dish?"],["Introductions · Basics","自我介绍 · 基础","My name is Tiana.","我叫 Tiana。","My name is Tiana, and I work with EO.","我叫 Tiana，在 EO 工作。","Could you introduce yourself?"],["Introductions · Practice","自我介绍 · 应用","I am based in Beijing.","我常驻北京。","I am based in Beijing and work with entrepreneurs.","我常驻北京，与企业家一起工作。","Where are you based?"],["Small talk · Basics","轻松寒暄 · 基础","It is nice to meet you.","很高兴认识你。","It is nice to meet you in person.","很高兴在线下见到你。","Have we met before?"],["Small talk · Practice","轻松寒暄 · 应用","I enjoyed our conversation.","我很享受我们的聊天。","I enjoyed our conversation at the event.","我很享受我们在活动上的交流。","Did you enjoy the event?"],["Weekend plans · Basics","周末计划 · 基础","I will visit a museum.","我会去参观博物馆。","I will visit a museum this weekend.","这周末我会去参观博物馆。","What are your plans for the weekend?"],["Weekend plans · Practice","周末计划 · 应用","I might stay at home.","我可能待在家里。","I might stay at home and read a book.","我可能待在家里读一本书。","Are you going out this weekend?"],["Asking directions · Basics","问路 · 基础","Where is the station?","车站在哪里？","Could you tell me where the station is?","请问你能告诉我车站在哪里吗？","Are you looking for the station?"],["Asking directions · Practice","问路 · 应用","I need to take the train.","我需要坐火车。","I need to take the train to the city center.","我需要坐火车去市中心。","How are you getting to the city center?"],["Hotel · Basics","酒店入住 · 基础","I have a reservation.","我有预订。","I have a reservation under the name Tiana.","我以 Tiana 的名字预订了房间。","Do you have a reservation?"],["Hotel · Practice","酒店入住 · 应用","Could I check in early?","我可以提前办理入住吗？","Could I check in early if a room is available?","如果有空房，我可以提前入住吗？","Would you like to check in now?"],["Travel stories · Basics","旅行经历 · 基础","I visited Japan.","我去过日本。","I visited Japan for a leadership meeting.","我去日本参加过领导力会议。","Have you ever visited Japan?"],["Travel stories · Practice","旅行经历 · 应用","The trip was memorable.","那次旅行令人难忘。","The trip was memorable because I met inspiring people.","那次旅行令人难忘，因为我结识了鼓舞人心的人。","What made the trip memorable?"],["Work responsibilities · Basics","工作职责 · 基础","I organize events.","我组织活动。","I organize learning events for EO members.","我为 EO 会员组织学习活动。","What do you do at EO?"],["Work responsibilities · Practice","工作职责 · 应用","I support chapter leaders.","我支持分会领导者。","I support chapter leaders with planning and communication.","我协助分会领导者进行规划和沟通。","How do you support chapter leaders?"],["Planning events · Basics","活动筹备 · 基础","We need a venue.","我们需要一个场地。","We need a venue for our next learning event.","下次学习活动我们需要一个场地。","What do we need for the event?"],["Planning events · Practice","活动筹备 · 应用","I will confirm the schedule.","我会确认日程。","I will confirm the schedule with the speakers.","我会和讲者确认日程。","Who will confirm the schedule?"],["Invitations · Basics","活动邀请 · 基础","Please join our event.","请参加我们的活动。","Please join our event next Thursday afternoon.","请下周四下午参加我们的活动。","When is the event?"],["Invitations · Practice","活动邀请 · 应用","I hope you can attend.","我希望你能参加。","I hope you can attend and share your experience.","我希望你能参加并分享你的经历。","What would you like me to share?"],["Confirmations · Basics","确认信息 · 基础","I will send the details.","我会发送详细信息。","I will send the details by email this afternoon.","我今天下午会通过邮件发送详细信息。","When will you send the details?"],["Confirmations · Practice","确认信息 · 应用","Could you confirm your attendance?","你能确认是否出席吗？","Could you confirm your attendance by Friday?","你能在周五前确认是否出席吗？","When do I need to confirm?"],["Managing changes · Basics","处理变化 · 基础","The time has changed.","时间改了。","The meeting time has changed to three o'clock.","会议时间改到三点了。","Has the meeting time changed?"],["Managing changes · Practice","处理变化 · 应用","We need another option.","我们需要另一个方案。","We need another option because the venue is unavailable.","我们需要另一个方案，因为场地无法使用。","Why do we need another option?"],["Online meetings · Basics","线上会议 · 基础","Can you hear me?","你能听到我说话吗？","Can you hear me clearly on this call?","这通电话里你能清楚听到我吗？","Is my microphone working?"],["Online meetings · Practice","线上会议 · 应用","I cannot see your screen.","我看不到你的屏幕。","I cannot see your screen; could you share it again?","我看不到你的屏幕，你能重新分享吗？","Can everyone see my screen?"],["Taking turns · Basics","会议发言 · 基础","I have a question.","我有一个问题。","I have a question about our next steps.","我有个关于下一步计划的问题。","Does anyone have a question?"],["Taking turns · Practice","会议发言 · 应用","Could I add one point?","我可以补充一点吗？","Could I add one point before we move on?","在进入下一个话题前我可以补充一点吗？","Would you like to add anything?"],["Sharing opinions · Basics","表达观点 · 基础","I agree with you.","我同意你的看法。","I agree with you on this important point.","在这个重要问题上我同意你的看法。","What do you think about this idea?"],["Sharing opinions · Practice","表达观点 · 应用","I see it differently.","我有不同的看法。","I see it differently based on our chapter's experience.","根据我们分会的经验，我有不同的看法。","Do you see it the same way?"],["Explaining reasons · Basics","说明原因 · 基础","This matters to members.","这对会员很重要。","This matters to members because it builds trust.","这对会员很重要，因为它能建立信任。","Why does this matter to members?"],["Explaining reasons · Practice","说明原因 · 应用","We should focus on value.","我们应该关注价值。","We should focus on value rather than event numbers.","我们应该关注价值，而不只是活动数量。","What should we focus on?"],["Making suggestions · Basics","提出建议 · 基础","I have an idea.","我有一个想法。","I have an idea that could improve engagement.","我有个或许能改善参与度的想法。","Do you have any suggestions?"],["Making suggestions · Practice","提出建议 · 应用","We could try a new format.","我们可以试试新形式。","We could try a new format for next month's event.","我们可以在下个月活动中尝试新形式。","How could we improve the event?"],["Membership · Basics","会籍增长 · 基础","We welcome new members.","我们欢迎新会员。","We welcome new members from different industries.","我们欢迎来自不同行业的新会员。","How can we welcome new members?"],["Membership · Practice","会籍增长 · 应用","Referrals are important.","推荐很重要。","Member referrals are important for healthy growth.","会员推荐对健康增长很重要。","What helps our chapter grow?"],["Member experience · Basics","会员体验 · 基础","Members want to connect.","会员希望建立连接。","Members want to connect with people they trust.","会员希望与信任的人建立连接。","What do members value?"],["Member experience · Practice","会员体验 · 应用","We should listen to feedback.","我们应该听取反馈。","We should listen to feedback after every event.","我们应该在每场活动之后听取反馈。","How can we improve member experience?"],["Forum · Basics","Forum 小组 · 基础","Forum builds trust.","Forum 建立信任。","Forum builds trust through honest conversations.","Forum 通过真诚对话建立信任。","Why is Forum valuable?"],["Forum · Practice","Forum 小组 · 应用","We respect confidentiality.","我们尊重保密原则。","We respect confidentiality in every Forum session.","在每次 Forum 活动中我们都尊重保密原则。","What is an important Forum rule?"],["Leadership · Basics","领导力 · 基础","Leadership takes practice.","领导力需要练习。","Leadership takes practice and honest feedback.","领导力需要练习和真诚反馈。","How do people develop leadership skills?"],["Leadership · Practice","领导力 · 应用","We support new leaders.","我们支持新领导者。","We support new leaders during their transition.","我们支持新领导者完成交接过渡。","How do we support new leaders?"],["Regional teamwork · Basics","区域协作 · 基础","We share resources.","我们共享资源。","We share resources across chapters in North Asia.","我们在北亚区不同分会之间共享资源。","How can chapters work together?"],["Regional teamwork · Practice","区域协作 · 应用","Let us learn from each other.","让我们互相学习。","Let us learn from each other's successes and challenges.","让我们从彼此的成功与挑战中学习。","What can we learn from other chapters?"],["Giving updates · Basics","汇报进展 · 基础","We made progress.","我们取得了进展。","We made progress on membership recruitment this month.","这个月我们在会员招募方面取得了进展。","How is recruitment going?"],["Giving updates · Practice","汇报进展 · 应用","We still have challenges.","我们仍面临挑战。","We still have challenges with member retention.","我们在会员留存方面仍面临挑战。","What challenges are you facing?"],["Clarifying · Basics","澄清理解 · 基础","Could you repeat that?","你能重复一下吗？","Could you repeat that a little more slowly?","你能稍微慢一点重复吗？","Did you catch what I said?"],["Clarifying · Practice","澄清理解 · 应用","Let me clarify one thing.","让我澄清一点。","Let me clarify one thing about the timeline.","让我澄清一下时间安排。","Is the timeline clear to everyone?"],["Summarizing · Basics","总结讨论 · 基础","Here is my summary.","这是我的总结。","Here is my summary of our discussion today.","这是我对今天讨论的总结。","Could you summarize our discussion?"],["Summarizing · Practice","总结讨论 · 应用","We agreed on three actions.","我们达成了三项行动共识。","We agreed on three actions for the next quarter.","我们就下一季度的三项行动达成共识。","What did we agree on?"],["Next steps · Basics","落实行动 · 基础","I will follow up.","我会跟进。","I will follow up with the chapter managers tomorrow.","我明天会跟进各分会经理。","Who will follow up after the meeting?"],["Next steps · Practice","落实行动 · 应用","Let us set a deadline.","我们来设定截止时间。", // Learning notes: everyday usage, form and natural examples for each day's paired lessons
const grammarNotes=[
[["enjoy + V-ing","enjoy 表示「喜欢并享受做某事」。当 enjoy 后面跟动作时，动词要变为 -ing 形式，而不是 enjoy to travel。","I enjoy traveling. ✅　I enjoy to travel. ❌","I enjoy reading and cooking."],["like + V-ing","like doing 强调长期的兴趣、爱好；exploring 是 explore 加 -ing。like to do 也可以，但常用于具体选择或习惯。","I like exploring new places.","I like meeting new people."]],
[["usually + 动词","usually 是频率副词，通常放在普通动词之前；它帮助你说清日常习惯。","I usually get up early.","I usually drink tea after lunch."],["after + 名词／V-ing","after dinner 表示晚饭后；after working 表示工作之后。介词 after 后面接动作时用 -ing。","I take a walk after dinner.","I relax after working."]],
[["like + V-ing","用 like + 动词 -ing 表达长期爱好。books about… 表示关于某主题的书。","I like reading books.","I like learning new things."],["to + 动词原形（目的）","to relax 表示「为了放松」。这里的 to 后面用动词原形，与 enjoy + -ing 不同。","I practice yoga to relax.","I travel to learn."]],
[["especially + 重点","especially 用来强调你特别喜欢的东西，通常可以放在逗号后。","I love Chinese food, especially hot pot.","I enjoy traveling, especially by train."],["want to + 动词原形","want to do 表达想做某事；because 引出原因。注意 want 后是 to try，不是 trying。","I want to try this dish.","I want to go because it looks fun."]],
[["My name is… / I work with…","介绍姓名用 My name is；work with 表示与某人一起工作，后面接人或团队。","My name is Tiana.","I work with entrepreneurs."],["be based in + 地点","be based in 说的是常驻地或工作基地，不一定代表出生地。","I am based in Beijing.","Our team is based in Asia."]],
[["It is nice to + 动词","见面寒暄常用 It's nice to meet you；in person 表示面对面，而不是线上。","It is nice to meet you in person.","It's nice to see you again."],["enjoy + 名词","enjoy 后面既能接 -ing，也能直接接名词，例如 enjoy our conversation。","I enjoyed our conversation.","I enjoyed the workshop."]],
[["will + 动词原形","will 常用于临时决定或预计的未来安排，后面使用动词原形。","I will visit a museum.","I will call you tomorrow."],["might + 动词原形","might 表示「可能」，不确定程度较高。might 后面接动词原形。","I might stay at home.","I might join the event."]],
[["Could you…?","Could you…? 比直接说 Tell me… 更礼貌，适合问路和工作交流。","Could you tell me where the station is?","Could you help me?"] ,["need to + 动词原形","need to + 动词原形表示需要做某事，适合表达计划与必要性。","I need to take the train.","We need to leave soon."]],
[["have a reservation","在酒店或餐厅说 I have a reservation，under the name… 表示预订登记姓名。","I have a reservation under the name Tiana.","I have a booking for two nights."],["Could I…?","Could I…? 是礼貌地请求许可；if 后面加条件。","Could I check in early?","Could I sit here if it is free?"]],
[["过去式 visited","过去发生并结束的旅行，用一般过去时：visit → visited。","I visited Japan.","I attended a meeting last year."],["because + 完整句子","because 后面跟原因的完整句子；用它让你的讲述更具体。","The trip was memorable because I met new people.","I joined because I wanted to learn."]],
[["organize + 名词","organize an event 是「组织活动」。for 后面可说明服务对象。","I organize learning events for EO members.","I organize meetings for our team."],["support…with…","support someone with something 表示在某方面支持某人。","I support leaders with planning.","I help the team with communication."]],
[["need + 名词","We need a venue 表示需要一个场地，a 用在单数可数名词前。","We need a venue.","We need a larger room."],["will + 动词原形","说出你将承担的具体行动，用 I will + 动词原形。","I will confirm the schedule.","I will send the invitation."]],
[["please + 动词原形","礼貌邀请可以用 Please join…；具体时间放在句子后面。","Please join our event next Thursday.","Please come to the meeting."],["hope + 从句","I hope you can… 表达期待，比直接要求更柔和。","I hope you can attend.","I hope you can share your experience."]],
[["by + 时间点","by Friday 表示「不晚于周五」，不同于 on Friday（在周五）。","I will send it by Friday.","Please reply by tomorrow."],["Could you + 动词原形","礼貌询问和请求时，用 Could you confirm…?","Could you confirm your attendance?","Could you send the list?"]],
[["has changed（现在完成时）","has changed 强调变化已经发生、现在仍然有效。","The time has changed.","The plan has changed."],["because + 原因","用 because 表达行动背后的原因，让建议更容易理解。","We need another option because the venue is unavailable.","I am late because of traffic."]],
[["Can you hear me?","线上会议常用 Can you hear me?；clearly 是副词，用来修饰 hear。","Can you hear me clearly?","Can everyone hear me?"],["Could you + 动词原形","遇到技术问题，先说明情况，再礼貌请求。","Could you share it again?","Could you turn on your microphone?"]],
[["a question about…","have a question about… 表示对某主题有疑问。","I have a question about our next steps.","I have a question about the timeline."],["Could I add…?","Could I add one point? 是会议中礼貌插话的自然句型。","Could I add one point?","Could I share one example?"]],
[["agree with + 人","agree with someone 表示同意某人的观点；agree on something 表示对事项达成一致。","I agree with you.","We agree on the next steps."],["see it differently","I see it differently 是委婉表达不同意见的方法，避免直接说 You're wrong。","I see it differently.","I see it differently based on our experience."]],
[["because + 解释","观点之后用 because 给理由，会让表达更有说服力。","This matters because it builds trust.","Learning matters because members value growth."],["rather than + 名词／V-ing","rather than 表示「而不是」，用于对比更重要的重点。","Focus on value rather than numbers.","We prefer learning rather than competing."]],
[["could + 动词原形","could 表示可能的建议，比 must 或 should 更委婉。","This idea could improve engagement.","It could help new members."],["try + 名词","try a new format 表示尝试一种新形式。","We could try a new format.","Let's try a shorter meeting."]],
[["welcome + 名词","welcome new members 表示欢迎新会员；from 用于表达来自某行业或地区。","We welcome new members.","We welcome members from different industries."],["for + 目标","for healthy growth 表示为了健康增长。","Referrals are important for growth.","Feedback is useful for improvement."]],
[["want to + 动词原形","want to connect 表示希望建立连接。注意 want to 后动词用原形。","Members want to connect.","I want to learn."],["should + 动词原形","should 表示建议或应该做的事情，后面接动词原形。","We should listen to feedback.","We should follow up."]],
[["through + 名词／V-ing","through 表示通过某个方式，后面可接名词或动名词。","We build trust through conversations.","We learn through sharing."],["respect + 名词","respect confidentiality 表示遵守保密原则。","We respect confidentiality.","We respect different opinions."]],
[["takes + 名词","takes practice 表示需要练习；主语是 leadership，使用 takes。","Leadership takes practice.","Good listening takes patience."],["during + 名词","during their transition 表示在交接期间。","We support leaders during their transition.","I learned a lot during the summit."]],
[["across + 范围","across chapters 表示跨分会；across North Asia 表示整个北亚地区。","We share resources across chapters.","We work across regions."],["Let's + 动词原形","Let us / Let's 用于共同建议，后面用动词原形。","Let's learn from each other.","Let's review the results."]],
[["make progress on…","make progress on a project 表示某项工作有进展，过去式用 made。","We made progress on recruitment.","We made progress on the project."],["still + 动词","still 强调现状仍然持续，可以放在 have 之前。","We still have challenges.","We still need more information."]],
[["Could you + 动词原形","礼貌要求对方重复时，可以用 Could you repeat…?","Could you repeat that?","Could you speak more slowly?"] ,["Let me + 动词原形","Let me clarify… 是主动澄清的常用句型。","Let me clarify one thing.","Let me explain the timeline."]],
[["Here is…","Here is… 可用来引出总结、信息或材料。","Here is my summary.","Here is the latest update."],["agree on + 事项","agree on three actions 表示对三项具体行动达成共识。","We agreed on three actions.","We agreed on the deadline."]],
[["follow up with + 人","follow up with someone 表示继续跟进某人；follow up on something 表示跟进某事项。","I will follow up with the managers.","I will follow up on the action items."],["Let us + 动词原形","用 Let us set… 引导团队做出具体决定。","Let us set a deadline.","Let us define the next steps."]],
[["be ready to + 动词原形","be ready to speak 表示准备好发言。to 后面用动词原形。","I am ready to speak.","I am ready to share the update."],["Thank you for + V-ing","for 是介词，后面跟动词时用 -ing：Thank you for listening。","Thank you for listening.","Thank you for joining us."]]

function lessonGrammar(i){let day=Math.floor(i/2),side=i%2;return grammarNotes[day]?.[side]||grammarNotes[0][side]}
function renderGrammar(){const n=lessonGrammar(unit);$('#grammar').innerHTML='<div class="grammar-kicker">LANGUAGE NOTE / 为什么这样说</div><h3>'+esc(n[0])+'</h3><p>'+esc(n[1])+'</p><div class="grammar-example"><strong>'+esc(n[2])+'</strong><br><small>举一反三：'+esc(n[3])+'</small></div><p><button id="grammarListen" type="button">🔊 听例句</button></p>';$('#grammarListen').onclick=()=>speak(n[2].split(' ✅')[0]);}

const key='tiana-english-club-v2',state=JSON.parse(localStorage.getItem(key)||'{"done":[],"boxes":[],"xp":0,"dates":[]}');let unit=0,step=0,answer='',currentSpeak='',choice='',recognition=null;

// One-time user-requested Day 1 completion sync, preserving existing local progress.
if(!state.day1Backfill20261022){let count=0;for(const i of [0,1]){if(!state.done.includes(i)){state.done.push(i);count++}}state.xp+=count*25;if(count&&state.boxes.length<2)state.boxes.push({icon:'🧸',name:'启程纪念',rarity:'Day 1 特别纪念'});state.day1Backfill20261022=true;state.day2Opens='2026-10-23';localStorage.setItem(key,JSON.stringify(state));}
const day2Locked=()=>new Date().toLocaleDateString('en-CA')<(state.day2Opens||'2026-10-23');
const $=s=>document.querySelector(s),save=()=>localStorage.setItem(key,JSON.stringify(state)),s=(n)=>scenarios[n%scenarios.length],esc=t=>String(t).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;'),norm=t=>String(t).toLowerCase().replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim();
function render(){let completed=state.done.length;const locked=day2Locked();$('#dayStatus').textContent=locked?'✓ Day 1 已完成 · 两节课都已记录。Day 2 将在明天（10月23日）开放。':'✓ Day 1 已完成 · 现在可以继续 Day 2 的学习了。';$('#start').textContent=locked?'Day 1 已完成 · 明天见':'继续我的下一节课 →';$('#start').disabled=locked;$('#stats').textContent='⭐ '+state.xp+' XP · '+completed+'/60 节';$('#progressText').textContent=completed+' / 60';$('#bar').style.width=(completed/60*100)+'%';let today=new Date().toLocaleDateString('en-CA');let streak=0;for(let i=0;i<60;i++){let d=new Date();d.setDate(d.getDate()-i);if(state.dates.includes(d.toLocaleDateString('en-CA')))streak++;else if(i===0)continue;else break}$('#streak').textContent='🔥 '+streak+' 天持续学习';$('#map').innerHTML=Array.from({length:30},(_,i)=>'<button class="day '+(state.done.includes(i*2)&&state.done.includes(i*2+1)?'done':'')+'" data-day="'+i+'">Day '+(i+1)+'<div>'+(state.done.includes(i*2)?'●':'○')+' '+(state.done.includes(i*2+1)?'●':'○')+'</div></button>').join('');document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{let d=+b.dataset.day;if(d>0&&day2Locked()){alert('Day 2 明天（10月23日）开放。');return;}openUnit(d*2+(state.done.includes(d*2)?1:0))});$('#shelf').innerHTML=state.boxes.length?state.boxes.map(x=>'<div class="fig">'+x.icon+'<div style="font-size:11px">'+x.name+'</div><small>'+x.rarity+'</small></div>').join(''):'<p class="muted">完成第一节课，解锁你的第一只小人偶吧！</p>'}
function nextUnit(){let i=Array.from({length:60},(_,j)=>j).find(j=>!state.done.includes(j));return i===undefined?0:i}
function getVoices(){let a=speechSynthesis.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang));a.sort((x,y)=>Number(/premium|enhanced|natural|samantha|google|microsoft/i.test(y.name))-Number(/premium|enhanced|natural|samantha|google|microsoft/i.test(x.name)));let old=$('#voices').value;$('#voices').innerHTML=a.map((v,i)=>'<option value="'+i+'">'+esc(v.name)+' ('+esc(v.lang)+')</option>').join('');window.engVoices=a;if(a.some(v=>v.name===old))$('#voices').value=String(a.findIndex(v=>v.name===old));$('#voiceMsg').textContent=a.length?'已找到 '+a.length+' 个英语发音人。听感不自然时，可换一个声音试听。':'未找到英语发音人，请检查系统语音包。'}
function speak(t){currentSpeak=t;if(!('speechSynthesis'in window)){$('#voiceMsg').textContent='当前浏览器不支持语音朗读';return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=Number($('#speed').value);let v=window.engVoices?.[Number($('#voices').value)];if(v){u.voice=v;u.lang=v.lang}speechSynthesis.speak(u)}
function openUnit(i){if(i>=2&&day2Locked()){alert('Day 1 已完成！Day 2 将于明天（10月23日）开放。今天好好休息，期待明天再见。');return;}unit=i%60;step=0;$('#lesson').style.display='block';$('#lessonNum').textContent='Day '+(Math.floor(unit/2)+1)+' · 第'+(unit%2+1)+'节 · 5分钟微课';$('#lessonTitle').textContent=s(unit)[0]+' · '+s(unit)[1];$('#lesson').scrollIntoView({behavior:'smooth'});task()}
function choices(arr,good){let opts=[...arr];opts.sort(()=>Math.random()-.5);$('#task').innerHTML='<div class="options">'+opts.map(o=>'<button data-answer="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div>';document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{let yes=b.dataset.answer===good;if(yes){$('#feedback').innerHTML='✅ 正确！<strong>'+esc(good)+'</strong>';$('#next').disabled=false;document.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true)}else{$('#feedback').innerHTML='💡 这不是正确答案。正确表达的含义是：<strong>'+esc(good)+'</strong><p style="font-weight:400;margin:6px 0">请选择上面对应的选项，就可以继续。答错没关系。</p>';b.style.opacity='.5'}})}
function task(){renderGrammar();mistakes=0;const z=s(unit);$('#feedback').textContent='';$('#next').disabled=true;$('#mic').hidden=true;$('#next').textContent=step===5?'完成挑战 🎁':'下一步 →';const teacher=$('#teacher');teacher.innerHTML='<strong>Mia：</strong> '+['先听一个英语表达，再选择正确中文含义。','看看这句话的英语意思。','把短句扩展成更完整的表达。','轮到你了！根据中文提示自己输入英语。','听听真实情境中的问题，并选出合适回答。','最后一题：先试着凭记忆输入完整句子；需要时可以查看示范。'][step];let a=z[2],b=z[4];if(step===0){speak(a);choices([z[3],'我现在很忙。','我不喜欢说英语。'],z[3]);}else if(step===1){speak(b);choices([z[5],'我昨天没参加活动。','我想早点睡觉。'],z[5]);}else if(step===2){$('#task').innerHTML='<p>短句：<strong>'+esc(a)+'</strong></p><p>升级后是哪一句？</p>';let h=$('#task').innerHTML;choices([b,a,a.replace('.',' today.')],b);$('#task').insertAdjacentHTML('afterbegin',h);}else if(step===3){$('#task').innerHTML='<p><strong>'+esc(z[5])+'</strong></p><input id="typed" type="text" autocomplete="off" placeholder="在这里输入英文句子"><p><button id="check">检查答案</button> <button id="reveal" type="button">查看示范 / 提示</button></p>';$('#check').onclick=checkTyped;$('#reveal').onclick=()=>{$('#feedback').innerHTML='📘 参考句：<strong>'+esc(z[4])+'</strong><br><small>可以照着句子练习，再提交答案。</small>';speak(z[4])};$('#typed').onkeydown=e=>{if(e.key==='Enter')checkTyped()};}else if(step===4){speak(z[6]);$('#task').innerHTML='<p><strong>'+esc(z[6])+'</strong></p>';let h=$('#task').innerHTML;choices([b,'I am not sure.','See you tomorrow.'],b);$('#task').insertAdjacentHTML('afterbegin',h);}else{$('#task').innerHTML='<p>请凭记忆写出：<strong>'+esc(z[5])+'</strong></p><input id="typed" type="text" autocomplete="off" placeholder="不看前面的英文，再写一次"><p><button id="check">提交闯关答案</button> <button id="reveal" type="button">查看示范 / 提示</button></p>';$('#check').onclick=checkTyped;$('#reveal').onclick=()=>{$('#feedback').innerHTML='📘 参考句：<strong>'+esc(z[4])+'</strong><br><small>可以照着句子练习，再提交答案。</small>';speak(z[4])};$('#typed').onkeydown=e=>{if(e.key==='Enter')checkTyped()};}if($('#mode').value==='speak'&&(step===3||step===5)&&('SpeechRecognition'in window||'webkitSpeechRecognition'in window))$('#mic').hidden=false;}
let mistakes=0;
function wordDifference(given,expected){const a=given.trim().split(/\s+/),b=expected.trim().split(/\s+/);let parts=[];for(let i=0;i<Math.max(a.length,b.length);i++){let actual=a[i]||'（缺少）',wanted=b[i]||'（多余）';if(norm(actual)!==norm(wanted))parts.push('第 '+(i+1)+' 个词：你写的是「'+esc(actual)+'」，参考是「'+esc(wanted)+'」');}return parts.slice(0,5).join('<br>')}
function checkTyped(){let target=s(unit)[4],v=$('#typed').value.trim();if(!v){$('#feedback').textContent='请先输入一句英语；不会写可以点下方「查看示范」。';return}if(norm(v)===norm(target)){$('#feedback').innerHTML='✅ 很好！表达正确。<br><small>大小写、标点和多余空格都不会被扣分。</small>';$('#next').disabled=false;$('#typed').disabled=true;$('#check').disabled=true;return;}mistakes++;let diff=wordDifference(v,target);$('#feedback').innerHTML='💡 我找到可能的不同之处：<br>'+diff+'<p style="margin:8px 0 4px">参考句：<strong>'+esc(target)+'</strong></p><small>请照着提示修改，再点「检查答案」。</small>';if(mistakes>=2){$('#feedback').insertAdjacentHTML('beforeend','<p><button id="useExample" type="button">使用示范句，再读一遍 →</button></p>');$('#useExample').onclick=()=>{$('#typed').value=target;speak(target);$('#feedback').innerHTML='🔊 正在朗读示范句。看清楚每个词，再点「检查答案」继续。';$('#typed').focus();};}}
function finish(){if(!state.done.includes(unit)){state.done.push(unit);state.xp+=25;let today=new Date().toLocaleDateString('en-CA');if(!state.dates.includes(today))state.dates.push(today);let r=Math.random(),icons=[['🐻','软萌小熊','普通'],['🐰','月光兔兔','普通'],['🦊','蜜桃小狐','稀有'],['🦄','星光独角兽','隐藏款']];let x=r<.06?icons[3]:r<.28?icons[2]:icons[Math.floor(Math.random()*2)];state.boxes.push({icon:x[0],name:x[1],rarity:x[2]});save();alert('🎁 盲盒开启！\n你获得：'+x[1]+'（'+x[2]+'）\n今天的努力值得庆祝！')}$('#lesson').style.display='none';render();window.scrollTo({top:0,behavior:'smooth'})}
$('#next').onclick=()=>{if(step>=5)finish();else{step++;task()}};$('#start').onclick=()=>openUnit(nextUnit());$('#close').onclick=()=>$('#lesson').style.display='none';$('#repeat').onclick=()=>speak(currentSpeak||s(unit)[2]);$('#voiceTest').onclick=()=>speak('I enjoy traveling in my free time.');$('#mic').onclick=()=>{let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return;let r=new R();r.lang='en-US';r.onresult=e=>{$('#typed').value=e.results[0][0].transcript;checkTyped()};r.onerror=()=>$('#feedback').textContent='麦克风暂时无法识别，可直接输入答案。';r.start()};if('speechSynthesis'in window){getVoices();speechSynthesis.onvoiceschanged=getVoices;}render();
